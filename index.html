<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Formatter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <button id="theme-btn">🌙 Dark Mode</button>
    <div class="container">
      <div class="input-container">
        <h2>Type In Your Words</h2>
        <div class="input-box">
        <input type="text" id="input-field" placeholder="Type Your Text Here" />
        <button class="btn clear">Clear</button>
        </div>
      </div>

      <div class="btns-container">
        <button class="btn uppercase">ABC</button>
        <button class="btn lowercase">abc</button>
        <button class="btn capitalize">Abc</button>
        <button class="btn bold">Bold</button>
        <button class="btn italic">Italic</button>
        <button class="btn underline">Underline</button>
        <button class="btn copy">Copy</button>
        <button class="btn reset">Reset Formatting</button>
      </div>
      <button class="btn download">Click here for Download</button>

      <p id="output-field">Output</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
